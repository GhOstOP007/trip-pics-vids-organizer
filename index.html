<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GhOstOP studio — Sort my folder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;500;600;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<style>
:root{color-scheme:dark;--bg:#0b0a16;--ink:#ecebff;--pk:#8cf5d0;--mut:#9b99c4;--card:rgba(24,21,46,.72);--ln:rgba(140,245,208,.3);--dk:rgba(201,198,242,.5);--b1:#2c1b66;--b2:#0d4a46;--sh:0 12px 44px rgba(0,0,0,.5);--sl:rgba(150,150,220,.16);--hi:rgba(140,245,208,.14);--glow:rgba(140,245,208,.35);--gh1:#f4f3ff;--gh2:#b9b4ff;--eye:#14122b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){color-scheme:light;--bg:#f3f2ff;--ink:#14122b;--pk:#5b3fd6;--mut:#6a6893;--card:rgba(255,255,255,.78);--ln:rgba(91,63,214,.28);--dk:#1d1a3d;--b1:#d6cdff;--b2:#c8f3e6;--sh:0 12px 44px rgba(91,63,214,.14);--sl:rgba(91,63,214,.14);--hi:rgba(91,63,214,.1);--glow:rgba(91,63,214,.28);--gh1:#fff;--gh2:#d8d3ff;--eye:#14122b}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:500 14px/1.3 "Bricolage Grotesque",Inter,system-ui,sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);animation:fl 16s ease-in-out infinite alternate}
.bg i:nth-child(1){width:46vw;height:40vh;left:-10vw;top:-6vh;background:var(--b1)}
.bg i:nth-child(2){width:44vw;height:46vh;right:-8vw;bottom:-10vh;background:var(--b1);animation-delay:-6s}
.bg i:nth-child(3){width:30vw;height:30vh;left:36vw;top:46vh;background:var(--b2);animation-delay:-3s}
@keyframes fl{to{transform:translate(4vw,3vh) scale(1.12)}}
header{display:flex;align-items:center;gap:16px;padding:18px 24px 0}
.who{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.av{width:50px;height:50px;border-radius:50%;flex:none;border:2px solid var(--pk);overflow:hidden;box-shadow:0 0 18px var(--glow)}
.by{font-size:12px;font-weight:600}.by span{color:var(--pk);font-weight:500}
h1{margin:0;font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-.03em;line-height:1.1}
h1 em,.lab,.cap,.big em{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;color:var(--pk)}
h1 em{font-size:1.2em;letter-spacing:-.01em}
.ctl{display:flex;align-items:center;gap:10px}
.pill{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:99px;background:var(--card);font-size:13px;color:var(--mut);box-shadow:var(--sh);max-width:min(40vw,360px)}
.pill b{width:7px;height:7px;border-radius:50%;background:var(--pk);flex:none}
.pill.run b{animation:pu 1s infinite}.pill.ok b{background:var(--pk);box-shadow:0 0 10px var(--pk)}
@keyframes pu{50%{transform:scale(1.7);opacity:.5}}
#msg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s}
.sort{display:flex;align-items:center;gap:8px;padding:6px 18px 6px 8px;border:0;border-radius:99px;background:var(--card);color:var(--ink);font:800 15px "Bricolage Grotesque",sans-serif;cursor:pointer;box-shadow:var(--sh);transition:transform .2s;white-space:nowrap}
.sort:hover:not(:disabled){transform:translateY(-1px) scale(1.03)}
.sort:disabled{cursor:default;opacity:.55}
.sort svg{width:34px;height:34px}
.sort.alt[aria-pressed=true]{color:var(--pk)}
.sort svg{color:var(--pk)}
.sort.cta{background:var(--pk);color:var(--bg);padding:12px 20px;font-weight:700;font-size:14px;box-shadow:0 0 28px var(--glow);animation:cta 2.4s ease-in-out infinite}
.sort.cta:hover{transform:translateY(-1px) scale(1.03)}
@keyframes cta{50%{box-shadow:0 0 44px var(--pk)}}
.btn.p{background:var(--pk);border-color:var(--pk);color:var(--bg)}
.sort.alt{padding:11px 16px;font-weight:600;font-size:13px}.sort.alt svg{width:15px;height:15px}
:focus-visible{outline:2px solid var(--pk);outline-offset:3px}
.stats{margin:16px 24px 0;display:grid;grid-template-columns:repeat(5,1fr);border-radius:24px;background:var(--card);box-shadow:var(--sh);overflow:hidden;backdrop-filter:blur(8px)}
.st{padding:16px 18px 14px;border-left:1px solid var(--sl)}
.st:first-child{border:0;background:linear-gradient(100deg,var(--hi),transparent)}
.lb{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.lb i{width:6px;height:6px;border-radius:50%}
.st output{display:block;font-size:32px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:2px}
.st:first-child output{color:var(--pk)}
main{flex:1;display:grid;grid-template-columns:minmax(260px,29%) 1fr minmax(260px,29%);gap:22px;padding:16px 24px 24px;min-height:560px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.lab{display:flex;align-items:center;gap:8px;font-size:23px}
.lab i{width:8px;height:8px;border-radius:50%;background:var(--pk);box-shadow:0 0 8px var(--pk)}
.col.v .lab i{background:var(--ink)}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.col.v .grid{grid-auto-rows:minmax(150px,1fr);align-content:stretch}
.card{border-radius:16px;border:1.5px solid var(--ln);background:var(--card);padding:10px 12px;min-height:80px;opacity:0;transform:translateY(12px) scale(.97);filter:blur(6px);transition:opacity .5s,transform .5s,filter .5s}
.col.v .card{border-color:var(--dk)}
.card.on{opacity:1;transform:none;filter:none}
.ch{display:flex;align-items:center;gap:7px;font-size:12.5px}
.ch b{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
.ch svg{width:14px;height:14px;flex:none}
.ch .n{font-style:normal;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.card.lc{min-height:112px}
main.loc .col.v .lab{visibility:hidden}
main.loc .col.v .grid{grid-auto-rows:auto;align-content:start}
main.loc .col.v .card{border-color:var(--ln)}
.stage{position:relative;min-height:440px}
#flower{position:absolute;left:50%;top:47%;width:min(300px,80%);aspect-ratio:1;translate:-50% -50%;opacity:.55;transition:opacity 1s,scale 1.2s cubic-bezier(.2,.8,.2,1)}
#flower.bright{opacity:1;scale:.62}
#flower svg{width:100%;height:100%;overflow:visible}
#flower svg{filter:drop-shadow(0 0 26px var(--glow))}
.gbody{animation:bob 4.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.gsh{transform-box:fill-box;transform-origin:center;animation:shd 4.5s ease-in-out infinite}
@keyframes shd{50%{transform:scale(.8);opacity:.12}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.happy{display:none}#flower.bright .happy{display:block}#flower.bright .eyes{display:none}
.cap{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:18px;transition:opacity .2s}
.tray{position:absolute;left:50%;bottom:34px;translate:-50% 0;width:min(100%,330px)}
.drop{position:fixed;inset:12px;z-index:25;border:2px dashed var(--pk);border-radius:28px;background:color-mix(in srgb,var(--bg) 70%,transparent);display:grid;place-content:center;font:italic 400 30px "Instrument Serif",Georgia,serif;color:var(--pk);opacity:0;pointer-events:none;transition:opacity .2s}
.drop.on{opacity:1}
#cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
.end{position:fixed;inset:0;z-index:30;display:grid;place-content:center;justify-items:center;gap:26px;text-align:center;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);opacity:0;visibility:hidden;transition:opacity .7s,visibility .7s;padding:24px}
.end.on{opacity:1;visibility:visible}
.big{margin:0;font-size:clamp(34px,7vw,64px);font-weight:800;letter-spacing:-.04em;line-height:1.1;min-height:2.3em}
.big em{font-size:1.14em;letter-spacing:-.02em}
.caret{display:inline-block;width:3px;height:.85em;background:var(--pk);margin-left:3px;vertical-align:-.05em;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.acts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;opacity:0;pointer-events:none;transition:opacity .6s}
.acts.on{opacity:1;pointer-events:auto}
.sub{max-width:44ch;color:var(--mut);font-size:13px;margin:-8px 0 0;opacity:0;transition:opacity .6s}.sub.on{opacity:1}
.btn{padding:12px 22px;border-radius:99px;border:1.5px solid var(--dk);background:var(--ink);color:var(--bg);font:700 14px "Bricolage Grotesque",sans-serif;cursor:pointer}
.btn.g{background:transparent;color:var(--ink)}
@media(max-width:860px){
 header{flex-wrap:wrap}.ctl{width:100%;flex-wrap:wrap}.pill{max-width:none;flex:1;min-width:0}
 .stats{grid-template-columns:repeat(2,1fr)}.st{border-top:1px solid var(--sl)}.st:last-child{grid-column:1/-1}
 main{grid-template-columns:1fr}.stage{min-height:380px}}
@media(prefers-reduced-motion:reduce){.gbody,.gsh,.eye,.bg i,.cta{animation:none}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="fl" viewBox="0 0 64 64"><path d="M12 56V28C12 15 21 6 32 6s20 9 20 22v28l-6.7-6-6.6 6-6.7-6-6.7 6-6.6-6z" fill="currentColor"/><circle cx="24" cy="28" r="3.6" fill="var(--bg)"/><circle cx="40" cy="28" r="3.6" fill="var(--bg)"/><ellipse cx="32" cy="38" rx="3" ry="4" fill="var(--bg)"/></symbol></defs></svg>

<header>
  <div class="who">
    <svg class="av" viewBox="0 0 50 50" role="img" aria-label="GhOstOP studio avatar"><rect width="50" height="50" fill="#14122b"/><use href="#fl" x="9" y="8" width="32" height="32" style="color:#8cf5d0"/></svg>
    <div><div class="by">GhOstOP studio <span>· AI editing</span></div><h1>Sorting my <em id="fn">Downloads</em> folder</h1></div>
  </div>
  <div class="ctl">
    <div class="pill" id="pill" role="status" aria-live="polite"><b></b><span id="msg">Choose a folder to begin</span></div>
    <button class="sort alt" id="pick"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M1.8 4.2c0-.7.5-1.2 1.2-1.2h3l1.4 1.5H13c.7 0 1.2.5 1.2 1.2v6c0 .7-.5 1.2-1.2 1.2H3c-.7 0-1.2-.5-1.2-1.2z"/></svg>Choose folder</button>
    <button class="sort alt" id="mode" title="Sort by what’s in the photo, or by where it was taken (GPS metadata)">Sort by: Content</button>
    <button class="sort alt" id="geo" hidden title="Place names are looked up with OpenStreetMap Nominatim. One rounded coordinate per place is sent, never your photos.">Place names: online</button>
    <button class="sort alt" id="ai" aria-pressed="true" title="Use a local AI model (CLIP) to recognise what’s in each photo">AI sort: on</button>
    <button class="sort cta" id="act" hidden>Move files into folders</button>
    <button class="sort" id="sort" disabled><svg aria-hidden="true"><use href="#fl"/></svg><span id="sl">Sort</span></button>
  </div>
</header>

<section class="stats" aria-label="Progress">
  <div class="st"><span class="lb">Total files</span><output id="s0">0</output></div>
  <div class="st"><span class="lb"><i style="background:var(--ink)"></i>Videos</span><output id="s1">0</output></div>
  <div class="st"><span class="lb"><i style="background:var(--pk)"></i>Photos</span><output id="s2">0</output></div>
  <div class="st"><span class="lb">Folders created</span><output id="s3">0</output></div>
  <div class="st"><span class="lb">Duplicates found</span><output id="s4">0</output></div>
</section>

<main>
  <div class="col"><div class="lab"><i></i><span id="plab">Photos</span></div><div class="grid" id="pg"></div></div>
  <div class="stage" id="stage">
    <div id="flower"><svg viewBox="0 0 200 230" aria-hidden="true"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--gh1)"/><stop offset="1" style="stop-color:var(--gh2)"/></linearGradient></defs><ellipse class="gsh" cx="100" cy="216" rx="46" ry="7" fill="var(--pk)" opacity=".28"/><g class="gbody"><path d="M30 196V92C30 48 62 14 100 14s70 34 70 78v104l-18-16-18 18-17-17-17 17-18-18-18 16-17-16z" fill="url(#gg)" stroke="var(--pk)" stroke-width="3" stroke-linejoin="round"/><circle cx="60" cy="120" r="10" fill="var(--pk)" opacity=".2"/><circle cx="140" cy="120" r="10" fill="var(--pk)" opacity=".2"/><g class="eyes"><ellipse class="eye" cx="76" cy="92" rx="9" ry="13" fill="var(--eye)"/><ellipse class="eye" cx="124" cy="92" rx="9" ry="13" fill="var(--eye)"/></g><g class="happy" fill="none" stroke="var(--eye)" stroke-width="5" stroke-linecap="round"><path d="M64 98q12-18 24 0"/><path d="M112 98q12-18 24 0"/></g><ellipse cx="100" cy="128" rx="8" ry="11" fill="var(--eye)"/></g></svg></div>
    <div class="card tray" id="tray"><div class="ch"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.6 9h6.8L12 4"/></svg><b>Duplicates → review</b><i class="n">0</i></div></div>
    <div class="cap" id="cap">choose a folder to sort</div>
  </div>
  <div class="col v"><div class="lab"><i></i>Videos</div><div class="grid" id="vg"></div></div>
</main>

<canvas id="cv" aria-hidden="true"></canvas>
<div class="drop" id="drop">Drop a folder to sort it</div>
<input type="file" id="inp" webkitdirectory multiple hidden>

<div class="end" id="end" role="dialog" aria-label="Summary">
  <h2 class="big" id="big"></h2>
  <p class="sub" id="sub"></p>
  <div class="acts" id="acts">
    <button class="btn p" id="apply">Move files into folders</button>
    <button class="btn p" id="zip">Download sorted ZIP</button>
    <button class="btn p" id="undo">Undo move</button>
    <button class="btn g" id="again">Sort again</button>
    <button class="btn g" id="back">Back to folders</button>
  </div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s),RM=matchMedia('(prefers-reduced-motion: reduce)').matches,K=RM?.35:1;
const rnd=Math.random,clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),fmt=n=>n.toLocaleString('en-US');
const IMG=/\.(jpe?g|png|webp|gif|bmp|avif|heic|heif|tiff?)$/i,VID=/\.(mp4|mov|m4v|webm|mkv|avi|3gp)$/i,MAXF=6000;

/* flower */

/* folders */
const PH=[['Selfies & talking','selfie'],['Outfits','outfit'],['Food & cafés','food'],['Travel & vibe','travel'],['Nature','nature'],['Aesthetic spaces','aesth'],['Sport & wellness','sport'],['Music & hobby','music'],['Work from home','work'],['Text & captions','text'],['Screenshots','shot']];
const VI=[['Selfies & talking','selfie'],['Music & hobby','music'],['Work from home','work'],['Text & captions','text']];
let folders=[],mode='content',geoOn=true,locInfo='';
try{mode=localStorage.getItem('ys-mode')==='loc'?'loc':'content';geoOn=localStorage.getItem('ys-geo-on')!=='0'}catch{}
const FIC='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M1.8 4.2c0-.7.5-1.2 1.2-1.2h3l1.4 1.5H13c.7 0 1.2.5 1.2 1.2v6c0 .7-.5 1.2-1.2 1.2H3c-.7 0-1.2-.5-1.2-1.2z"/></svg>';
function build(list,col,vid){list.forEach(([name,cat])=>{const el=document.createElement('div');el.className='card';el.innerHTML=`<div class="ch">${FIC}<b>${name}</b><i class="n">0</i></div>`;col.append(el);folders.push({name,cat,vid,el,nEl:el.querySelector('.n')})})}
const dupF={name:'Duplicates',dup:true,el:$('#tray'),nEl:$('#tray .n')};
const safe=n=>n.replace(/[\\/:*?"<>|]+/g,'-').trim()||'Unnamed';
function addLoc(name,side='#pg'){const el=document.createElement('div');el.className='card lc';el.innerHTML=`<div class="ch">${FIC}<b>${name}</b><i class="n">0</i></div>`;$(side).append(el);
 const f={name,dir:safe(name),loc:1,vid:false,el,nEl:el.querySelector('.n'),got:0,asg:0,shown:0,slots:[]};folders.push(f);return f}
function mkFolders(){$('#pg').innerHTML='';$('#vg').innerHTML='';folders=[];
 if(mode==='content'){build(PH,$('#pg'),false);build(VI,$('#vg'),true)}
 Object.assign(dupF,{got:0,asg:0,shown:0,slots:[]});dupF.nEl.textContent=0;dupF.el.classList.remove('on');folders.push(dupF)}
const destPath=t=>t.f.dup?['_Duplicates']:mode==='loc'?[t.f.dir]:[t.vid?'Videos':'Photos',t.f.name];

/* ui refs + stats */
const S={t:0,v:0,p:0,f:0,d:0},E={t:$('#s0'),v:$('#s1'),p:$('#s2'),f:$('#s3'),d:$('#s4')},shown={};
const paintStats=()=>{for(const k in S)if(shown[k]!==S[k]){shown[k]=S[k];E[k].textContent=fmt(S[k])}};
const msg=$('#msg'),capEl=$('#cap'),pill=$('#pill'),btn=$('#sort'),sl=$('#sl'),fl=$('#flower'),end=$('#end'),big=$('#big'),acts=$('#acts'),sub=$('#sub'),stage=$('#stage'),inp=$('#inp');
const swap=(el,txt)=>{el.style.opacity=0;setTimeout(()=>{el.textContent=txt;el.style.opacity=1},180)};

/* canvas */
const cv=$('#cv'),g=cv.getContext('2d');let D=1;
function size(){D=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*D;cv.height=innerHeight*D}
addEventListener('resize',size);size();

/* state */
let phase='idle',T0=0,tiles=[],N=0,sp=0,landed=0,ovl=0,tok=0,doneAt=0,TS=0,allIn=0,inAt=0,skipped=0;
let entries=[],dirH=null,log=[];
const busy=()=>['collect','geo','sort','apply'].includes(phase);
const syncBtn=()=>{syncAct();btn.disabled=busy()||!entries.length;$('#pick').disabled=busy();$('#ai').disabled=busy();$('#mode').disabled=busy();$('#geo').disabled=busy()};

/* ---------- picking a folder ---------- */
async function listDir(h){const out=[];for await(const [n,x] of h.entries())if(x.kind==='file'&&(IMG.test(n)||VID.test(n)))out.push({name:n,getFile:()=>x.getFile()});return out}
function adopt(list,name,h){
 reset();dirH=h;
 const over=list.length>MAXF;entries=list.slice(0,MAXF);
 $('#fn').textContent=name;
 swap(msg,entries.length?`Found ${fmt(entries.length)} photos & videos${over?' (first '+fmt(MAXF)+')':''}${h?'':' · read-only'}`:'No photos or videos in this folder');
 swap(capEl,entries.length?'a total mess':'choose a folder to sort');syncBtn();
}
async function load(h){try{adopt(await listDir(h),h.name,h)}catch(e){swap(msg,'Couldn’t read that folder')}}
async function pick(){
 if(busy())return;
 if(window.showDirectoryPicker){try{load(await showDirectoryPicker({mode:'readwrite'}));return}catch(e){if(e.name==='AbortError')return}}
 inp.click();
}
inp.onchange=()=>{const fs=[...inp.files];if(!fs.length)return;
 const name=fs[0].webkitRelativePath.split('/')[0]||'Selection';
 adopt(fs.filter(f=>(IMG.test(f.name)||VID.test(f.name))&&f.webkitRelativePath.split('/').length<=2).map(f=>({name:f.name,getFile:async()=>f})),name,null);inp.value=''};
$('#pick').onclick=pick;
const dz=$('#drop');
addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('on')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)dz.classList.remove('on')});
addEventListener('drop',async e=>{e.preventDefault();dz.classList.remove('on');if(busy())return;
 const it=e.dataTransfer.items[0];if(!it||!it.getAsFileSystemHandle)return swap(msg,'Use “Choose folder” in this browser');
 const h=await it.getAsFileSystemHandle();if(h&&h.kind==='directory'){try{await h.requestPermission({mode:'readwrite'})}catch{}load(h)}});

/* ---------- local analysis ---------- */
const rr=(g,x,y,w,h,r)=>{g.beginPath();g.roundRect(x,y,w,h,r)};
const cir=(g,x,y,r,c)=>{g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill()};
function mkSprite(bm,vid,name){

   (mode==='loc'?locInfo+' ':'')+(dirH?(mode==='loc'?'Nothing has moved yet. “Move files into folders” creates one folder per place plus _Duplicates, and you can undo it.':'Nothing has moved yet. “Move files into folders” creates Photos, Videos and _Duplicates inside your folder, and you can undo it.'):'This browser can’t change your folder directly, so you can download the sorted result as a ZIP instead.'))}
}

/* ---------- closing card ---------- */
function openEnd(a,b,show,note){
 ['apply','zip','undo','again','back'].forEach(id=>$('#'+id).hidden=!show.includes(id));
 acts.classList.remove('on');sub.classList.remove('on');sub.textContent=note||'';
 end.classList.add('on');const my=++tok,s=a+'\n'+b;let k=0;
 const paint=()=>{const [l1,l2='']=s.slice(0,k).split('\n'),i=l2.indexOf(' '),h=i>0?`<em>${l2.slice(0,i)}</em>${l2.slice(i)}`:l2?`<em>${l2}</em>`:'';big.innerHTML=l1+(k>a.length?'<br>':'')+h+'<span class="caret"></span>'};
 const tick=()=>{if(my!==tok)return;paint();if(k<s.length){k++;setTimeout(tick,k===a.length+1?380:RM?10:55)}else{acts.classList.add('on');sub.classList.add('on');const f=acts.querySelector('.btn:not([hidden])');f&&f.focus({preventScroll:true})}};
 tick();
}

/* ---------- run / reset ---------- */
function reset(){
 phase='idle';tok++;tiles=[];sp=landed=ovl=allIn=skipped=0;N=0;mkFolders();
 for(const k in S)S[k]=0;paintStats();
 folders.forEach(f=>{f.got=f.asg=f.shown=0;f.slots=[];f.nEl.textContent=0;f.el.classList.remove('on')});
 end.classList.remove('on');acts.classList.remove('on');big.innerHTML='';
 fl.classList.remove('bright');pill.className='pill';sl.textContent='Sort';syncBtn();
}
async function start(){
 if(!entries.length||busy())return;
 const keep=entries;reset();entries=keep;
 phase='collect';pill.classList.add('run');syncBtn();aiHits=0;
 if(mode==='loc'&&!window.exifr){try{msg.textContent='Loading the metadata reader…';await loadScript(EXIFR)}catch{phase='idle';pill.classList.remove('run');syncBtn();swap(msg,'Couldn’t load the EXIF reader, check your connection');return}}
 if(mode==='content'&&aiOn&&!ai.ready){try{await loadAI()}catch(err){console.error(err);aiOn=false;setAiBtn();msg.textContent='AI model couldn’t load, using built-in rules';await new Promise(r=>setTimeout(r,1600))}}
 T0=performance.now();
 swap(msg,mode==='loc'?'Reading photo locations…':ai.ready&&aiOn?'Looking at each photo with AI…':'Reading photos & videos from your folder…');swap(capEl,'gathering everything…');
 let idx=0;
 const worker=async()=>{while(idx<entries.length){const e=entries[idx++];try{await analyze(e)}catch{skipped++}if(idx%25===0)msg.textContent=`Reading… ${fmt(Math.min(idx,entries.length))} of ${fmt(entries.length)}`}};
 await Promise.all([...Array(4)].map(worker));
 allIn=1;inAt=(performance.now()-T0)/1000;
}
btn.onclick=start;
$('#again').onclick=()=>{const keep=entries;reset();entries=keep;syncBtn();setTimeout(start,350)};
$('#back').onclick=()=>end.classList.remove('on');
addEventListener('keydown',e=>{if(e.key==='Escape')end.classList.remove('on')});

/* ---------- apply to disk (File System Access API) ---------- */
const sub_=async(dir,path,create=true)=>{for(const p of path)dir=await dir.getDirectoryHandle(p,{create});return dir};
async function uniq(dir,name){let n=name,i=1;const dot=name.lastIndexOf('.'),b=dot>0?name.slice(0,dot):name,x=dot>0?name.slice(dot):'';for(;;){try{await dir.getFileHandle(n);n=`${b} (${i++})${x}`}catch{return n}}}
async function mv(sd,name,dd,to){
 const h=await sd.getFileHandle(name);
 try{await h.move(dd,to);return}catch{}
 const src=await h.getFile(),nh=await dd.getFileHandle(to,{create:true}),w=await nh.createWritable();
 await src.stream().pipeTo(w);
 if((await nh.getFile()).size!==src.size)throw Error('size mismatch');
 await sd.removeEntry(name)}
async function apply(){
 phase='apply';syncBtn();end.classList.remove('on');pill.classList.remove('ok');pill.classList.add('run');log=[];let i=0,fail=0;
 for(const t of tiles){
  const path=destPath(t);
  try{const dd=await sub_(dirH,path),to=await uniq(dd,t.e.name);await mv(dirH,t.e.name,dd,to);log.push({from:t.e.name,path,to})}catch{fail++}
  if(++i%5===0||i===N)msg.textContent=`Moving files… ${fmt(i)} of ${fmt(N)}`}
 try{const lf=await dirH.getFileHandle('_sort-log.json',{create:true}),w=await lf.createWritable();await w.write(JSON.stringify(log,null,1));await w.close()}catch{}
 pill.classList.remove('run');pill.classList.add('ok');phase='applied';entries=[];syncBtn();
 swap(msg,fail?`Moved ${fmt(log.length)}, ${fail} couldn’t be moved`:'Done, files moved into folders');
 openEnd(`${fmt(log.length)} files moved.`,'Sorted on disk.',['undo','back'],'A record of every move is saved in _sort-log.json inside the folder.')}
async function undo(){
 phase='apply';syncBtn();end.classList.remove('on');pill.classList.remove('ok');pill.classList.add('run');let i=0;
 for(const r of log.slice().reverse()){
  try{const d=await sub_(dirH,r.path,false),to=await uniq(dirH,r.from);await mv(d,r.to,dirH,to)}catch{}
  if(++i%5===0)msg.textContent=`Putting files back… ${fmt(i)} of ${fmt(log.length)}`}
 for(const n of new Set(log.map(r=>r.path[0]))){try{const d=await dirH.getDirectoryHandle(n),ks=[];for await(const [k,x] of d.entries())if(x.kind==='directory')ks.push(k);for(const k of ks){try{await d.removeEntry(k)}catch{}}await dirH.removeEntry(n)}catch{}}
 try{await dirH.removeEntry('_sort-log.json')}catch{}
 const n=log.length;log=[];phase='applied';entries=await listDir(dirH);pill.classList.remove('run');pill.classList.add('ok');syncBtn();
 swap(msg,'Everything’s back where it was');openEnd(`${fmt(n)} files restored.`,'Back where they were.',['again','back'])}
async function zip(){
 if(!window.JSZip)return swap(msg,'ZIP library didn’t load — check your connection');
 end.classList.remove('on');pill.classList.add('run');pill.classList.remove('ok');
 const z=new JSZip();
 tiles.forEach(t=>z.file(`${destPath(t).join('/')}/${t.e.name}`,t.file));
 const blob=await z.generateAsync({type:'blob',compression:'STORE'},m=>{msg.textContent=`Zipping… ${m.percent|0}%`});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${$('#fn').textContent}-sorted.zip`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4e4);
 pill.classList.remove('run');pill.classList.add('ok');swap(msg,'ZIP downloaded');openEnd('ZIP ready.','Sorted and saved.',['again','back'])}
$('#apply').onclick=apply;$('#undo').onclick=undo;$('#zip').onclick=zip;

function syncAct(){const a=phase==='done'?(dirH?'apply':'zip'):phase==='applied'&&log.length?'undo':null,b=$('#act');b.hidden=!a;if(a){b.dataset.a=a;b.textContent=a==='apply'?'Move files into folders':a==='zip'?'Download sorted ZIP':'Undo move'}}
$('#act').onclick=()=>{const f={apply,zip,undo}[$('#act').dataset.a];f&&f()};
function applyMode(){const loc=mode==='loc';document.querySelector('main').classList.toggle('loc',loc);$('#plab').textContent=loc?'Places':'Photos';$('#ai').hidden=loc;$('#geo').hidden=!loc;$('#mode').textContent='Sort by: '+(loc?'Location':'Content');$('#geo').textContent='Place names: '+(geoOn?'online':'off');swap(capEl,entries.length?'a total mess':'choose a folder to sort')}
$('#mode').onclick=()=>{if(busy())return;mode=mode==='loc'?'content':'loc';try{localStorage.setItem('ys-mode',mode)}catch{}const keep=entries;reset();entries=keep;applyMode();syncBtn()};
$('#geo').onclick=()=>{if(busy())return;geoOn=!geoOn;try{localStorage.setItem('ys-geo-on',geoOn?'1':'0')}catch{}applyMode()};
applyMode();reset();requestAnimationFrame(frame);
})();
</script>
